# Continuous Integration
#
# Runs on every push to master and on every pull request, on both Linux
# and Windows (the cfg-gated capture backends mean each platform compiles
# code the other never sees). It builds the workspace, runs the tests,
# checks formatting, and runs the Clippy linter. If any step fails, GitHub
# marks the commit / PR with a red X so you catch breakage before it lands.
name: CI

# paths-ignore skips the whole run when a push/PR only touches these files,
# so doc-only changes don't trigger a full compile. If a commit touches both
# a doc file and any other file, CI still runs.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE

# Cancel an in-progress run if you push again to the same branch/PR, so you
# don't waste CI minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      # Let the other platform finish even if one fails, so a red run
      # shows every broken platform at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # cpal (ALSA), pipewire, and ashpd link against system libraries, so we
      # need their development headers. clang is required because the pipewire
      # crate generates bindings with bindgen at build time. Windows needs
      # nothing extra: cpal uses WASAPI and the capture backend uses WinRT,
      # both part of the stock toolchain.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            clang \
            pkg-config

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches compiled dependencies between runs so CI stays fast.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent, so one platform checks it.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Run Clippy (lint)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace
